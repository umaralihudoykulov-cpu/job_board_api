services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_board_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app
             -k uvicorn.workers.UvicornWorker
             -w 4
             -b 0.0.0.0:8000"

  postgres:
    image: postgres:16
    container_name: job_board_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strong_postgres_password
      POSTGRES_DB: job_board_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_board_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: