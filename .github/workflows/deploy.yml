name: Deploy Job Board API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/job_board_api

            git fetch origin main
            git reset --hard origin/main

            source .venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            alembic upgrade head

            sudo systemctl daemon-reload
            sudo systemctl restart job-board

            sleep 5

            sudo systemctl is-active --quiet job-board
            sudo systemctl status job-board --no-pager

            for i in {1..10}; do
              if curl -f http://127.0.0.1:8000/; then
                echo "Application is healthy"
                exit 0
              fi

              echo "Waiting for application to start... attempt $i"
              sleep 3
            done

            echo "Application failed health check"
            sudo journalctl -u job-board -n 100 --no-pager
            exit 1
